<text x="317.6" y="226" font-size="12" font-weight="600">6.3%  <tspan class="t2" font-weight="400">580</tspan></text>
<text x="188" y="256" font-size="13" text-anchor="end">Flight Booking Problems</text>
<path d="M200,242 h96.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-96.0 z" fill="var(--bar)"/>
<text x="308.0" y="256" font-size="12" font-weight="600">5.8%  <tspan class="t2" font-weight="400">529</tspan></text>
