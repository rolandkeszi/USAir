<svg xmlns="http://www.w3.org/2000/svg" width="860" height="442" viewBox="0 0 860 442" role="img" aria-labelledby="t d">
<title id="t">Why passengers complain: reasons given in negative tweets</title>
<desc id="d">Customer Service Issue: 31.7%; Late Flight: 18.1%; Cancelled Flight: 9.2%; Lost Luggage: 7.9%; Bad Flight: 6.3%; Flight Booking Problems: 5.8%; Flight Attendant Complaints: 5.2%; Long lines: 1.9%; Damaged Luggage: 0.8%; Can't Tell: 13.0%</desc>
<style>
svg{--bg:#ffffff;--t1:#1f2328;--t2:#59636e;--grid:#d1d9e0;--neg:#e34948;--neu:#b8b7b1;--pos:#2a78d6;--bar:#e34948;--muted:#b8b7b1;--on:#ffffff;--onneu:#1f2328}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--t1:#f0f6fc;--t2:#9198a1;--grid:#30363d;--neg:#e66767;--neu:#5c5c58;--pos:#3987e5;--bar:#e66767;--muted:#5c5c58;--on:#ffffff;--onneu:#f0f6fc}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--t1)}
.t2{fill:var(--t2)} .g{stroke:var(--grid);stroke-width:1}
</style>
<rect width="860" height="442" rx="8" fill="var(--bg)"/>
<text x="24" y="34" font-size="18" font-weight="600">What drives the negative tweets</text>
<text x="24" y="54" font-size="13" class="t2">Labelled reason, share of 9,178 negative tweets</text>
<line class="g" x1="200.0" x2="200.0" y1="84" y2="388"/><text x="200.0" y="404" font-size="11" class="t2" text-anchor="middle">0%</text>
<line class="g" x1="373.5" x2="373.5" y1="84" y2="388"/><text x="373.5" y="404" font-size="11" class="t2" text-anchor="middle">10%</text>
<line class="g" x1="546.9" x2="546.9" y1="84" y2="388"/><text x="546.9" y="404" font-size="11" class="t2" text-anchor="middle">20%</text>
<line class="g" x1="720.4" x2="720.4" y1="84" y2="388"/><text x="720.4" y="404" font-size="11" class="t2" text-anchor="middle">30%</text>
<text x="188" y="106" font-size="13" text-anchor="end">Customer Service Issue</text>
<path d="M200,92 h546.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-546.0 z" fill="var(--bar)"/>
<text x="758.0" y="106" font-size="12" font-weight="600">31.7%  <tspan class="t2" font-weight="400">2,910</tspan></text>
<text x="188" y="136" font-size="13" text-anchor="end">Late Flight</text>
