<text x="522.7" y="136" font-size="12" font-weight="600">18.1%  <tspan class="t2" font-weight="400">1,665</tspan></text>
<text x="188" y="166" font-size="13" text-anchor="end">Cancelled Flight</text>
<path d="M200,152 h156.1 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-156.1 z" fill="var(--bar)"/>
<text x="368.1" y="166" font-size="12" font-weight="600">9.2%  <tspan class="t2" font-weight="400">847</tspan></text>
<text x="188" y="196" font-size="13" text-anchor="end">Lost Luggage</text>
