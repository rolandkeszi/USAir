<path d="M200,272 h86.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-86.9 z" fill="var(--bar)"/>
<text x="298.9" y="286" font-size="12" font-weight="600">5.2%  <tspan class="t2" font-weight="400">481</tspan></text>
<text x="188" y="316" font-size="13" text-anchor="end">Long lines</text>
<path d="M200,302 h29.6 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-29.6 z" fill="var(--bar)"/>
<text x="241.6" y="316" font-size="12" font-weight="600">1.9%  <tspan class="t2" font-weight="400">178</tspan></text>
<text x="188" y="346" font-size="13" text-anchor="end">Damaged Luggage</text>
<path d="M200,332 h10.0 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-10.0 z" fill="var(--bar)"/>
<text x="222.0" y="346" font-size="12" font-weight="600">0.8%  <tspan class="t2" font-weight="400">74</tspan></text>
<text x="188" y="376" font-size="13" text-anchor="end">Can't Tell</text>
<path d="M200,362 h220.9 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-220.9 z" fill="var(--muted)"/>
<text x="432.9" y="376" font-size="12" font-weight="600">13.0%  <tspan class="t2" font-weight="400">1,190</tspan></text>
<text x="24" y="430" font-size="11" class="t2">"Can't Tell": annotators could not identify a single reason.</text>
