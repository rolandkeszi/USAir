<svg xmlns="http://www.w3.org/2000/svg" width="860" height="466" viewBox="0 0 860 466" role="img" aria-labelledby="t d">
<title id="t">Sentiment of tweets about six US airlines, February 2015</title>
<desc id="d">US Airways: 78% negative, 9% positive; American: 71% negative, 12% positive; United: 69% negative, 13% positive; Southwest: 49% negative, 24% positive; Delta: 43% negative, 24% positive; Virgin America: 36% negative, 30% positive</desc>
<style>
svg{--bg:#ffffff;--t1:#1f2328;--t2:#59636e;--grid:#d1d9e0;--neg:#e34948;--neu:#b8b7b1;--pos:#2a78d6;--bar:#e34948;--muted:#b8b7b1;--on:#ffffff;--onneu:#1f2328}
@media (prefers-color-scheme: dark){svg{--bg:#0d1117;--t1:#f0f6fc;--t2:#9198a1;--grid:#30363d;--neg:#e66767;--neu:#5c5c58;--pos:#3987e5;--bar:#e66767;--muted:#5c5c58;--on:#ffffff;--onneu:#f0f6fc}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--t1)}
.t2{fill:var(--t2)} .g{stroke:var(--grid);stroke-width:1}
</style>
<rect width="860" height="466" rx="8" fill="var(--bg)"/>
<text x="24" y="34" font-size="18" font-weight="600">How passengers talk about US airlines on Twitter</text>
