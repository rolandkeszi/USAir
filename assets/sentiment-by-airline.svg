<text x="300" y="98" font-size="26" font-weight="700">63%</text><text x="300" y="120" font-size="12" class="t2">of all tweets are negative</text>
<text x="576" y="98" font-size="26" font-weight="700">8.4×</text><text x="576" y="120" font-size="12" class="t2">more negative than positive tweets for US Airways</text>
